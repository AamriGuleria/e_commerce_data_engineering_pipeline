services:
  postgres:
    image: postgres:16
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: ecommerce_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/ecommerce_db
      ASYNC_DATABASE_URL: postgresql+asyncpg://admin:admin123@postgres:5432/ecommerce_db
    command: bash -lc "python -c 'print(\"ETL environment ready. Run your scripts from /app\")'"
  grafana:
    image: grafana/grafana
    container_name: grafana_ecommerce
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    restart: unless-stopped
    ports:
      - "3000:3000"
    # depends_on:
    #   - prometheus
volumes:
  postgres_data: